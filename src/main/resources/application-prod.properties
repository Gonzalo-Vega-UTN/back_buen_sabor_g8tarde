web.cors.allowed-origins=${CORS_ORIGINS}
CLOUDINARY_URL=${CLOUDINARY_URL}
# puerto de ejecución
server.port=8080

spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow

